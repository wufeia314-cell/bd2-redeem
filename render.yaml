# Render.com 一键部署配置（免费版即可获得公网域名）
# 部署后访问：https://<你的服务名>.onrender.com/
#
# 重要：在 Render 后台的 Environment 里设置 BD2_ADMIN_TOKEN 为你自己的强口令！
#
# 模式说明（v2 手动兑换）：
#   玩家在前端点「兑换」即时调官方接口，昵称与「已兑换」记录只存前端 localStorage，
#   服务端不存任何玩家数据。服务端仅持久化礼包码清单（SQLite，服务启动即自动抓取），
#   免费实例重启 / 重新部署后码库清空会自动重新抓取，因此无需挂载持久磁盘 / Postgres。
services:
  - type: web
    name: bd2-redeem
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    envVars:
      - key: BD2_HOST
        value: "0.0.0.0"
      - key: BD2_PORT
        value: "8000"
      - key: BD2_ADMIN_TOKEN
        sync: false   # 在 Render 控制台手动填写
      - key: BD2_FETCH_ENABLED
        value: "1"
      - key: BD2_FETCH_INTERVAL_MIN
        value: "30"
      - key: BD2_DB_PATH
        value: "data/bd2.db"
