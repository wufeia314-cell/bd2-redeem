<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#7a4a24" />
<title>棕色尘埃2 · 礼包码兑换</title>
<style>
  :root{
    --bg:#f6f2ec;--bg2:#efe7dd;--card:#ffffff;--line:#ece3d6;--txt:#33291f;--sub:#9a8f80;
    --accent:#9a5e2c;--accent-d:#7a4a22;--accent-l:#d99648;--accent-soft:#fbeedd;
    --ok:#1f8a4c;--err:#cf3b3b;--pending:#b3791a;
    --ok-bg:#e8f6ed;--err-bg:#fdeaea;--pending-bg:#fdf3e2;
    --chip:#f4ece1;--chip-l:#e6d4bd;
    --shadow:0 6px 22px rgba(120,78,35,.10);
    --shadow-sm:0 2px 10px rgba(120,78,35,.07);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  /* 背景方案（移动端兼容优先）：body 建层叠上下文，背景图放 ::before 最底层，
     暖色半透明罩放 ::after，确保 iOS/Android 都稳定透出且不被父级背景盖死。 */
  body{position:relative;z-index:0;
    color:var(--txt);line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  html{background:#f6f2ec}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:url('/static/bg.webp') center/cover no-repeat;
    opacity:.18}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 55% at 50% -12%, rgba(255,246,234,.42) 0%, transparent 55%),
      linear-gradient(180deg, rgba(246,242,236,.50) 0%, rgba(239,231,221,.60) 100%)}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
       padding:0 0 calc(40px + env(safe-area-inset-bottom));position:relative}

  /* ===== 顶部 hero ===== */
  .hero{position:relative;overflow:hidden;color:#fff;
        padding:calc(30px + env(safe-area-inset-top)) 22px 24px;
        background:linear-gradient(155deg,rgba(90,52,22,.78) 0%,rgba(140,84,38,.70) 42%,rgba(190,128,62,.58) 100%)}
  .hero::before{content:"";position:absolute;left:-50px;top:-60px;width:200px;height:200px;
        background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);border-radius:50%}
  .hero::after{content:"";position:absolute;right:-60px;bottom:-70px;width:220px;height:220px;
        background:radial-gradient(circle,rgba(0,0,0,.08),transparent 70%);border-radius:50%}
  .hero .badge{position:relative;z-index:1;display:inline-block;font-size:11px;letter-spacing:.6px;
        background:rgba(255,255,255,.18);backdrop-filter:blur(4px);
        padding:4px 11px;border-radius:20px;margin-bottom:12px;border:1px solid rgba(255,255,255,.22)}
  .hero h1{position:relative;z-index:1;margin:0;font-size:23px;font-weight:800;letter-spacing:.5px;
        text-shadow:0 2px 8px rgba(0,0,0,.35)}
  .hero p{position:relative;z-index:1;margin:9px 0 0;font-size:13px;opacity:.96;line-height:1.65;
        text-shadow:0 1px 5px rgba(0,0,0,.32)}

  /* ===== 昵称栏 ===== */
  .nickbar{position:relative;z-index:10;background:#fff;border:1px solid var(--line);
           border-radius:var(--radius);padding:14px 16px;margin:-22px 16px 0;box-shadow:var(--shadow)}
  .nickbar label{display:block;font-size:12px;color:var(--sub);margin-bottom:7px}
  .nickbar input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;
                 outline:none;background:#fff;color:var(--txt);box-sizing:border-box}
  .nickbar input::placeholder{color:#c2b8ac}
  .nickbar .hint{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.5}

  /* ===== 面板 ===== */
  .panels{flex:1;padding:18px 16px 0}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;
        box-shadow:var(--shadow-sm);margin-bottom:16px}
  .card h2{margin:0 0 2px;font-size:15px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:6px}

  /* 礼包码卡片网格 */
  .codes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .codes-header h2{margin:0;font-size:15px;font-weight:800;letter-spacing:.2px}
  .code-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .code-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 11px 10px;
             box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;position:relative;
             transition:transform .12s,box-shadow .2s;animation:cardIn .3s ease both}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .code-card:active{transform:translateY(-2px);box-shadow:var(--shadow)}
  .code-card .meta-top{display:flex;justify-content:space-between;align-items:flex-start;gap:5px}
  .code-card .dates{display:flex;flex-direction:column;gap:0}
  .code-card .upd{font-size:10.5px;color:var(--txt);font-weight:600}
  .code-card .exp{font-size:10.5px;color:var(--sub)}
  .code-card .status{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9px;white-space:nowrap}
  .code-card .status.active{background:var(--ok-bg);color:var(--ok)}
  .code-card .status.expired{background:#f1f1f1;color:#9a9a9a}
  .code-card .status.inactive{background:var(--err-bg);color:var(--err)}
  .code-card.dead{opacity:.55}
  .code-card .status.dead{background:#eee;color:#999}
  .code-card .status.claimed{background:#f1f1f1;color:#9a9a9a}
  .code-card .body{display:flex;align-items:center;gap:9px}
  .code-card .icon{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--chip),var(--chip-l));
                   display:flex;align-items:center;justify-content:center;flex:0 0 40px}
  .code-card .icon svg{width:22px;height:22px;fill:var(--accent)}
  .code-card .icon .icon-img{width:40px;height:40px;border-radius:11px;object-fit:contain;
                             background:#fff;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
  .code-card .reward{flex:1;min-width:0}
  .code-card .reward-name{font-size:12.5px;font-weight:700;color:var(--txt);line-height:1.3;word-break:break-all}
  .code-card .reward-qty{font-size:11px;color:var(--sub);margin-top:1px}
  .code-card .code-row{display:flex;align-items:center;justify-content:space-between;gap:6px;
                       background:rgba(250,246,240,.88);border-radius:9px;padding:7px 9px;margin-top:1px}
  .code-card .code-str{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;color:var(--accent);word-break:break-all}
  .code-card .copy{width:26px;height:26px;border:0;background:rgba(154,94,44,.1);border-radius:7px;cursor:pointer;
                   display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s}
  .code-card .copy:active{background:rgba(154,94,44,.2)}
  .code-card .copy svg{width:16px;height:16px;fill:var(--accent)}
  .redeem-all-btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;cursor:pointer;
             background:linear-gradient(135deg,#7a4a22,#9a5e2c);color:#fff;font-size:15px;font-weight:800;
             letter-spacing:.5px;box-shadow:0 4px 14px rgba(122,74,34,.3);transition:transform .12s,opacity .2s}
  .redeem-all-btn:active{transform:scale(.98)}
  .redeem-all-btn:disabled{opacity:.65;cursor:default}
  .empty{display:block;color:var(--sub);font-size:13px;padding:14px 0;text-align:center;line-height:1.7}
  .empty a,.retry{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dashed currentColor;cursor:pointer}

  .foot{color:var(--sub);font-size:11.5px;text-align:center;padding:22px 18px calc(20px + env(safe-area-inset-bottom));
        line-height:1.8;border-top:1px solid var(--line);margin-top:8px}

  /* 浮动提示 */
  .toast{position:fixed;left:50%;top:18%;transform:translateX(-50%) translateY(-12px);
        background:rgba(43,38,32,.94);color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;
        z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center;
        box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <span class="badge">BD2 · 礼包码兑换</span>
    <h1>🎁 礼包码兑换</h1>
  </div>

  <div class="nickbar">
    <label for="nickname">你的游戏昵称</label>
    <input id="nickname" maxlength="24" placeholder="请输入游戏昵称" autocomplete="off" />
    <div class="hint">昵称与已兑换记录仅存本机浏览器，不会上传服务器。</div>
    <button id="redeemAllBtn" class="redeem-all-btn" onclick="redeemAll()">一键兑换全部</button>
  </div>

  <div class="panels">
    <div class="card">
      <div class="codes-header">
        <h2>当前生效的礼包码</h2>
      </div>
      <div id="codes"><span class="empty">加载中…</span></div>
    </div>
  </div>

  <div class="foot">
    仅调用官方公开兑换接口，奖励发放至游戏邮箱。<br/>
    本工具与 NEOWIZ 无隶属关系，请遵守游戏服务条款，理性使用。
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 防 XSS：外部/用户内容先过 esc()
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// 昵称与已兑换记录存本地
const LS_NICK='bd2_nick';
const LS_REDEEMED='bd2_redeemed';
const state={codes:[]};  // 当前展示的礼包码列表，供「一键兑换全部」遍历

function getRedeemed(){try{return JSON.parse(localStorage.getItem(LS_REDEEMED)||'{}');}catch(e){return {};}}
function markRedeemed(code, kind){const m=getRedeemed();m[code]={t:Date.now(),kind:kind||'done'};localStorage.setItem(LS_REDEEMED,JSON.stringify(m));}
function redeemedKind(code){const v=getRedeemed()[code];if(!v)return null;return (v&&typeof v==='object'&&v.kind)?v.kind:'done';}

function toast(msg, ms){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'), ms||2200);
}

// 带超时与容错的请求
async function requestJson(url, method, body){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),20000);
  try{
    const opt={method,headers:{'Accept':'application/json'},signal:ctrl.signal};
    if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
    const r=await fetch(url,opt);
    const text=await r.text();
    if(!text) throw new Error(`服务器返回空响应（HTTP ${r.status}）`);
    let data;
    try{data=JSON.parse(text);}catch(e){throw new Error(`响应非合法 JSON（HTTP ${r.status}）：\n${text.slice(0,300)}`);}
    return {status:r.status,ok:r.ok,data};
  }finally{clearTimeout(timer);}
}

function fmtMD(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d)) return '';
  return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysLeft(iso){
  if(!iso) return '长期有效';
  let exp;
  if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) exp=new Date(iso+'T00:00:00Z');
  else exp=new Date(iso);
  if(isNaN(exp)) return '';
  const now=new Date();
  const diff=Math.ceil((exp-now)/(1000*60*60*24));
  if(diff<0) return '已过期';
  if(diff===0) return '今天过期';
  return `${diff}天后过期`;
}

// 是否含中文字符（区分 GameKee 中文权威源 与 英文抓取源）
function _hasCJK(s){return !!s && /[　-〿一-鿿＀-￯]/.test(s);}
const _DEAD_OFF={expired:1,invalid:1,exceeded:1,unavailable:1};
function _isBottomCode(c){
  const off=c.official_status||'pending';
  if(_DEAD_OFF[off]) return true;
  const pending=(off==='pending'||off===''||off==null);
  const trusted=(c.source==='auto:gamekee')||_hasCJK(c.reward_name)||_hasCJK(c.description)||!pending;
  return !trusted;
}

const ICONS={
  gift:'<svg viewBox="0 0 24 24"><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7"/><rect x="2" y="7" width="20" height="5" rx="1"/><path d="M12 7a3 3 0 0 1 3-3c1.3 0 2.4.8 2.8 2M12 7a3 3 0 0 0-3-3 3.4 3.4 0 0 0-2.8 2M12 7v13"/></svg>',
  ticket:'<svg viewBox="0 0 24 24"><path d="M3 9v6a1 1 0 0 0 1 1h1.5a.5.5 0 0 1 .5.5v3a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 1 .5-.5H20a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1h-2V4a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v4H8V4a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v4H4a1 1 0 0 0-1 1z"/></svg>',
  powder:'<svg viewBox="0 0 24 24"><path d="M9 3h6l2 5-5 13-5-13z"/><circle cx="12" cy="10" r="2"/></svg>',
  gold:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2"/></svg>',
  deco:'<svg viewBox="0 0 24 24"><path d="M12 2l2.5 6.5L21 10l-5 4.5L17 21 12 17.5 7 21l1-6.5L3 10l6.5-1.5z"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><path d="M12 2l2.4 4.9L20 8.2l-3.8 3.7.9 5.4-5.1-2.7-5.1 2.7.9-5.4L4 8.2l5.6-1.3z"/></svg>',
  exp:'<svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3L22 9.3l-5 4.9 1.2 6.9L12 16.9l-6.2 4.2 1.2-6.9-5-4.9 6.9-1z"/></svg>'
};
const COPY_SVG='<svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="14" rx="2"/><path d="M16 7h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-3"/></svg>';

function copyCode(code){
  const ok=()=>toast('已复制 '+code);
  const fail=()=>toast('复制失败，请长按手动复制');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(ok).catch(()=>fallbackCopy(code,ok,fail));
  } else { fallbackCopy(code,ok,fail); }
}
function fallbackCopy(text,ok,fail){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();
    document.execCommand('copy')?ok():fail();
    document.body.removeChild(ta);
  }catch(e){fail();}
}

function cssEscape(s){return String(s).replace(/["\\]/g,'\\$&');}

function renderCodes(list){
  const box=document.getElementById('codes');
  const redeemed=getRedeemed();
  if(!list.length){box.innerHTML='<span class="empty">暂无生效的礼包码</span>';return;}
  const ordered=list.slice().sort((a,b)=>(_isBottomCode(a)?1:0)-(_isBottomCode(b)?1:0));
  box.innerHTML=ordered.map(c=>{
    const upd=c.published_at?`${fmtMD(c.published_at)}上线`:'';
    const off=c.official_status||'pending';
    const DEAD={expired:'已过期',invalid:'已失效',exceeded:'已达上限',unavailable:'暂不可用'};
    const isDone=!!redeemed[c.code];
    let statusCls,statusText,exp;
    if(isDone){
      if(redeemedKind(c.code)==='already'){statusCls='claimed';statusText='已领过';}
      else{statusCls='active';statusText='已兑换 ✓';}
      exp='';
    }
    else if(DEAD[off]){statusCls='dead';statusText=DEAD[off];exp='';}
    else{statusCls='active';statusText='待兑换';exp=daysLeft(c.expires_at);}
    const hasReward=!!(c.reward_name||c.description);
    const rawQty=c.reward_qty||'';
    const qty=rawQty?(rawQty.toLowerCase().startsWith('x')?rawQty:'x'+rawQty):'';
    const iconHtml=c.reward_icon_url
      ? `<img class="icon-img" src="${esc(c.reward_icon_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=ICONS['${(c.reward_icon||'gift')}']">`
      : (ICONS[c.reward_icon]||ICONS.gift);
    const rewardBlock=hasReward?`
      <div class="body">
        <div class="icon">${iconHtml}</div>
        <div class="reward">
          <div class="reward-name">${esc(c.reward_name||c.description)}</div>
          ${qty?`<div class="reward-qty">${qty}</div>`:''}
        </div>
      </div>`:'';
    return `<div class="code-card${DEAD[off]?' dead':''}">
      <div class="meta-top">
        <div class="dates">${upd?`<span class="upd">${upd}</span>`:''}<span class="exp">${exp}</span></div>
        <span class="status ${statusCls}">${esc(statusText)}</span>
      </div>
      ${rewardBlock}
      <div class="code-row">
        <span class="code-str">${esc(c.code)}</span>
        <button class="copy" data-code="${esc(c.code)}" onclick="copyCode(this.dataset.code)" aria-label="复制">${COPY_SVG}</button>
      </div>
    </div>`;
  }).join('');
}

function failHtml(msg){
  return `<span class="empty">${esc(msg)}，<a class="retry" href="javascript:loadCodes()">点此重试</a></span>`;
}

async function loadCodes(){
  const box=document.getElementById('codes');
  box.innerHTML='<span class="empty">加载中…</span>';
  try{
    const {ok,data}=await requestJson('/api/codes','GET');
    if(!ok){box.innerHTML=failHtml('加载失败');return;}
    loadCodes._retried=false;
    const codes=data.codes||[];
    state.codes=codes;
    renderCodes(codes);
  }catch(e){
    box.innerHTML=failHtml('加载失败：'+e.message);
    if(!loadCodes._retried){loadCodes._retried=true;setTimeout(loadCodes,5000);}
  }
}

// 单个兑换请求
async function callRedeem(nickname, code){
  const {ok,data}=await requestJson('/api/redeem','POST',{nickname,code});
  return {ok,data,st:(data&&data.status)};
}

// 一键兑换全部：先验证昵称，再顺序兑换本机未兑换、官方未失效的码
async function redeemAll(){
  const nickname=(document.getElementById('nickname').value||'').trim();
  if(!nickname){
    toast('请填写游戏昵称',4000);
    document.getElementById('nickname').focus();
    return;
  }
  localStorage.setItem(LS_NICK,nickname);

  // 先验证昵称（官方探测，不消耗真实码）；昵称错直接拦下
  try{
    const {data}=await requestJson('/api/verify-nickname','POST',{nickname});
    if(data && data.exists===false){
      toast('❌ 昵称错误，请核对后重试',6000);
      return;
    }
  }catch(e){ /* 探测失败则放行，不让玩家卡住 */ }

  const redeemed=getRedeemed();
  const list=(state.codes||[]).filter(c=>{
    if(redeemed[c.code]) return false;                 // 本机已兑换
    const off=c.official_status||'pending';
    if(_DEAD_OFF[off]) return false;                   // 官方已判失效
    return true;
  });
  if(!list.length){
    toast('暂无可兑换的礼包码（都已兑换或列表为空）',4000);
    return;
  }

  const btn=document.getElementById('redeemAllBtn');
  btn.disabled=true;
  let done=0, success=0, already=0, failed=0;
  for(const c of list){
    btn.textContent=`兑换中… ${done}/${list.length}`;
    try{
      const {ok,data,st}=await callRedeem(nickname,c.code);
      if(st==='success'||st==='already'){
        markRedeemed(c.code, st==='already'?'already':'done');
        if(st==='success') success++; else already++;
      }else if(st==='bad_user'){
        failed++;
        toast('❌ 昵称错误，请核对后重试',6000);
        break;
      }else{
        failed++;
      }
    }catch(e){ failed++; }
    done++;
    btn.textContent=`兑换中… ${done}/${list.length}`;
    await new Promise(r=>setTimeout(r,120));
  }
  btn.disabled=false;
  btn.textContent='一键兑换全部';
  loadCodes();
  toast(`兑换完成：成功 ${success} / 已领过 ${already} / 失败 ${failed}`,5000);
}

// 昵称输入框回车聚焦 / 实时保存
document.getElementById('nickname').addEventListener('input',e=>{
  const v=e.target.value.trim();
  if(v) localStorage.setItem(LS_NICK,v); else localStorage.removeItem(LS_NICK);
});

// 进入时检查连通性并预载昵称 + 礼包码
(async function init(){
  try{await requestJson('/api/health','GET');}catch(e){/* 静默 */}
  const saved=localStorage.getItem(LS_NICK);
  if(saved) document.getElementById('nickname').value=saved;
  loadCodes();
})();
</script>
